<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DivulgaPro AI | Campanhas profissionais para produtos</title>
    <meta
      name="description"
      content="DivulgaPro AI transforma ideias, produtos e fotos em campanhas profissionais para Instagram, Stories, WhatsApp, Reels e TikTok."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="announcement" role="status">
      <span class="announcement-copy"><span class="announcement-spark" aria-hidden="true">✦</span> Crie campanhas profissionais para seus produtos em poucos minutos.</span>
      <button class="announcement-link" data-action="toast" data-message="O DivulgaPro AI organiza sua ideia em uma campanha pronta para revisar." type="button">Saiba mais</button>
    </div>

    <div class="app-shell landing-mode" data-sidebar="aberta" data-theme="claro">
      <aside class="sidebar" aria-label="Menu principal">
        <div class="brand-block">
          <div class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48">
              <path d="M9 28h7l17 8V12L16 20H9a4 4 0 0 0-4 4 4 4 0 0 0 4 4Z" />
              <path d="M18 30v7a3 3 0 0 0 3 3h4l-5-10Z" />
              <path d="M37 18l5-3M38 24h6M37 30l5 3" />
            </svg>
          </div>
          <div class="brand-copy">
            <strong>DivulgaPro AI</strong>
            <span>Transforme produtos em campanhas profissionais.</span>
          </div>
        </div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <button class="collapse-button" id="collapseSidebar" type="button">Recolher menu</button>
      </aside>

      <div class="mobile-backdrop" id="mobileBackdrop"></div>

      <section class="workspace">
        <header class="topbar">
          <button class="icon-button menu-button" id="openMenu" type="button" aria-label="Abrir menu"><span class="icon icon-menu" aria-hidden="true"></span></button>
          <a class="top-logo" href="#" data-action="home" aria-label="Ir para o início">
            <span class="mini-logo" aria-hidden="true"><span class="logo-spark">✦</span></span>
            <strong>DivulgaPro AI</strong>
            <span class="beta-badge">IA</span>
          </a>
          <div class="page-title">
            <span id="breadcrumb">Início</span>
            <h1 id="pageTitle">Início</h1>
          </div>
          <label class="search-box">
            <span>Buscar</span>
            <input id="globalSearch" type="search" placeholder="Buscar campanha, produto ou ideia" />
          </label>
          <button class="small-button header-help" data-action="toast" data-message="Central de ajuda aberta na simulação." type="button"><span class="icon icon-help" aria-hidden="true"></span> Ajuda</button>
          <button class="icon-button notification-button" id="notificationButton" type="button" aria-label="Notificações"><span class="icon icon-bell" aria-hidden="true"></span><span class="notification-dot" aria-hidden="true"></span></button>
          <div class="profile-wrap">
            <button class="profile-chip" id="profileButton" type="button" aria-expanded="false" aria-controls="profileMenu">
              <span class="avatar">ML</span>
              <span class="profile-copy"><strong>Moda Lima</strong><small>Loja conectada</small></span>
              <span class="profile-chevron" aria-hidden="true">⌄</span>
            </button>
            <div class="profile-menu" id="profileMenu" hidden>
              <strong>Moda Lima</strong>
              <span class="muted">Plano profissional</span>
              <button data-action="page" data-page="marca" type="button">Identidade da marca</button>
              <button data-action="page" data-page="configuracoes" type="button">Configurações</button>
            </div>
          </div>
        </header>

        <main id="appContent" class="content-area" tabindex="-1"></main>
      </section>
    </div>

    <div class="toast-stack" id="toastStack" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
